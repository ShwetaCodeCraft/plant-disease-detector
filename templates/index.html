<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PlantScan — Disease Detector</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --green-deep: #1a3a2a;
      --green-mid: #2d6a4f;
      --green-light: #52b788;
      --green-pale: #b7e4c7;
      --cream: #f8f4ec;
      --amber: #e9c46a;
      --red: #e76f51;
      --text-dark: #1a2a1f;
      --text-muted: #4a6358;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--green-deep);
      min-height: 100vh;
      color: var(--cream);
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(82,183,136,0.18) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 80% 90%, rgba(45,106,79,0.3) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 60% 40%, rgba(183,228,199,0.07) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    /* Leaf decorations */
    .leaf-deco {
      position: fixed;
      opacity: 0.06;
      pointer-events: none;
      z-index: 0;
      font-size: 200px;
      line-height: 1;
    }
    .leaf-deco.tl { top: -40px; left: -40px; transform: rotate(-30deg); }
    .leaf-deco.br { bottom: -40px; right: -40px; transform: rotate(150deg); }

    .wrapper {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 48px 20px 80px;
    }

    /* Header */
    header {
      text-align: center;
      margin-bottom: 56px;
      animation: fadeDown 0.8s ease both;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(82,183,136,0.15);
      border: 1px solid rgba(82,183,136,0.3);
      border-radius: 100px;
      padding: 6px 16px;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--green-pale);
      margin-bottom: 20px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(42px, 7vw, 80px);
      font-weight: 900;
      line-height: 1;
      letter-spacing: -2px;
      color: var(--cream);
    }

    h1 span {
      color: var(--green-light);
      font-style: italic;
    }

    .subtitle {
      margin-top: 16px;
      font-size: 16px;
      color: var(--text-muted);
      font-weight: 300;
      max-width: 400px;
      margin-inline: auto;
      line-height: 1.6;
    }

    /* Main card */
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 48px;
      width: 100%;
      max-width: 560px;
      backdrop-filter: blur(20px);
      animation: fadeUp 0.8s 0.2s ease both;
    }

    /* Upload zone */
    .upload-zone {
      border: 2px dashed rgba(82,183,136,0.35);
      border-radius: 18px;
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      background: rgba(82,183,136,0.04);
    }

    .upload-zone:hover, .upload-zone.drag {
      border-color: var(--green-light);
      background: rgba(82,183,136,0.1);
      transform: scale(1.01);
    }

    .upload-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      background: rgba(82,183,136,0.15);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      transition: transform 0.3s ease;
    }

    .upload-zone:hover .upload-icon { transform: scale(1.1) rotate(-5deg); }

    .upload-title {
      font-size: 16px;
      font-weight: 500;
      color: var(--cream);
      margin-bottom: 6px;
    }

    .upload-hint {
      font-size: 13px;
      color: var(--text-muted);
    }

    /* Preview */
    #preview-wrap {
      display: none;
      margin-top: 20px;
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    #preview {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      display: block;
      border-radius: 14px;
    }

    .preview-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 12px 16px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      font-size: 13px;
      color: rgba(255,255,255,0.8);
    }

    /* Button */
    .btn {
      margin-top: 24px;
      width: 100%;
      padding: 18px;
      background: var(--green-light);
      color: var(--green-deep);
      border: none;
      border-radius: 14px;
      font-family: 'DM Sans', sans-serif;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      letter-spacing: 0.02em;
    }

    .btn:hover:not(:disabled) {
      background: var(--green-pale);
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(82,183,136,0.3);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn.loading .btn-text { display: none; }
    .btn.loading::after {
      content: '';
      width: 20px; height: 20px;
      border: 2px solid var(--green-deep);
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Result */
    #result {
      display: none;
      margin-top: 28px;
      animation: fadeUp 0.5s ease both;
    }

    .result-label {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .result-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 24px;
    }

    .disease-name {
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--cream);
      line-height: 1.2;
      margin-bottom: 6px;
    }

    .disease-plant {
      font-size: 13px;
      color: var(--green-light);
      margin-bottom: 20px;
      font-weight: 500;
    }

    .confidence-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .confidence-label { font-size: 12px; color: var(--text-muted); }
    .confidence-val { font-size: 13px; font-weight: 500; color: var(--green-pale); }

    .confidence-bar {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 100px;
      overflow: hidden;
    }

    .confidence-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green-mid), var(--green-light));
      border-radius: 100px;
      width: 0%;
      transition: width 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Status pill */
    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 500;
      margin-top: 16px;
    }

    .status-pill.healthy {
      background: rgba(82,183,136,0.15);
      color: var(--green-pale);
      border: 1px solid rgba(82,183,136,0.3);
    }

    .status-pill.diseased {
      background: rgba(231,111,81,0.15);
      color: #f4a261;
      border: 1px solid rgba(231,111,81,0.3);
    }

    /* Stats row */
    .stats {
      display: flex;
      gap: 12px;
      margin-top: 32px;
      animation: fadeUp 0.8s 0.4s ease both;
    }

    .stat {
      flex: 1;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 14px;
      padding: 16px;
      text-align: center;
    }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--green-light);
    }

    .stat-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="leaf-deco tl">🌿</div>
  <div class="leaf-deco br">🌿</div>

  <div class="wrapper">
    <header>
      <div class="badge">🌱 AI-Powered</div>
      <h1>Plant<span>Scan</span></h1>
      <p class="subtitle">Upload a leaf image and our CNN model will instantly identify the disease with confidence scoring.</p>
    </header>

    <div class="card">
      <div class="upload-zone" id="dropZone">
        <input type="file" id="imageInput" accept="image/*" onchange="handleFile(event)"/>
        <div class="upload-icon">🍃</div>
        <p class="upload-title">Drop your leaf image here</p>
        <p class="upload-hint">or click to browse — JPG, PNG supported</p>
      </div>

      <div id="preview-wrap">
        <img id="preview" alt="Leaf preview"/>
        <div class="preview-overlay" id="fileName"></div>
      </div>

      <button class="btn" id="detectBtn" onclick="predict()" disabled>
        <span class="btn-text">🔬 Analyse Leaf</span>
      </button>

      <div id="result">
        <p class="result-label">Detection Result</p>
        <div class="result-card">
          <div class="disease-name" id="diseaseName"></div>
          <div class="disease-plant" id="plantName"></div>
          <div class="confidence-row">
            <span class="confidence-label">Confidence score</span>
            <span class="confidence-val" id="confVal"></span>
          </div>
          <div class="confidence-bar">
            <div class="confidence-fill" id="confBar"></div>
          </div>
          <div id="statusPill"></div>
        </div>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <div class="stat-num">38</div>
        <div class="stat-label">Disease classes</div>
      </div>
      <div class="stat">
        <div class="stat-num">97%</div>
        <div class="stat-label">Train accuracy</div>
      </div>
      <div class="stat">
        <div class="stat-num">54K</div>
        <div class="stat-label">Images trained</div>
      </div>
    </div>
  </div>

  <script>
    const dropZone = document.getElementById('dropZone');

    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag');
      const file = e.dataTransfer.files[0];
      if (file) showPreview(file);
    });

    function handleFile(e) {
      const file = e.target.files[0];
      if (file) showPreview(file);
    }

    function showPreview(file) {
      const preview = document.getElementById('preview');
      const wrap = document.getElementById('preview-wrap');
      const fileName = document.getElementById('fileName');
      preview.src = URL.createObjectURL(file);
      fileName.textContent = file.name;
      wrap.style.display = 'block';
      document.getElementById('detectBtn').disabled = false;
      document.getElementById('result').style.display = 'none';
    }

    async function predict() {
      const fileInput = document.getElementById('imageInput');
      if (!fileInput.files[0]) return;

      const btn = document.getElementById('detectBtn');
      btn.classList.add('loading');
      btn.disabled = true;

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      try {
        const res = await fetch('/predict', { method: 'POST', body: formData });
        const data = await res.json();

        // Parse result
        const raw = data.prediction; // e.g. "Apple___Black_rot"
        const parts = raw.split('___');
        const plant = parts[0].replace(/_/g, ' ');
        const disease = parts[1] ? parts[1].replace(/_/g, ' ') : raw.replace(/_/g, ' ');
        const conf = parseFloat(data.confidence);
        const isHealthy = disease.toLowerCase().includes('healthy');

        document.getElementById('diseaseName').textContent = disease;
        document.getElementById('plantName').textContent = '🌿 ' + plant;
        document.getElementById('confVal').textContent = data.confidence;
        document.getElementById('statusPill').innerHTML = isHealthy
          ? '<span class="status-pill healthy">✅ Healthy plant</span>'
          : '<span class="status-pill diseased">⚠️ Disease detected</span>';

        document.getElementById('result').style.display = 'block';
        setTimeout(() => {
          document.getElementById('confBar').style.width = conf + '%';
        }, 100);

      } catch (err) {
        alert('Error connecting to server. Make sure the FastAPI server is running!');
      }

      btn.classList.remove('loading');
      btn.disabled = false;
    }
  </script>
</body>
</html>
